<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<style>
:root{--bg:#0b0f19;--surface:#131a2a;--border:#232f4b;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8}
@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--accent:#0284c7}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
.side{padding:1rem;overflow:auto;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:.6rem}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
a{color:var(--accent);text-decoration:none;font-size:.9rem}
.nav{display:flex;justify-content:space-between;font-size:.9rem}
h1{font-size:1.4rem}
.fn{display:flex;align-items:center;gap:.4rem}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
input[type=text]{flex:1;min-width:0;padding:.55rem .7rem;font:1rem ui-monospace,Consolas,monospace;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px}
input.bad{border-color:#f87171}
button{padding:.5rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.go{background:var(--accent);color:#0b0f19;border-color:var(--accent);font-weight:600}
.d{font:.8rem ui-monospace,monospace;color:var(--muted);margin:.15rem 0 .5rem 1.4rem;cursor:pointer;word-break:break-all}
label{display:block;font:.85rem ui-monospace,monospace;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:.8rem;color:var(--muted)}
@media(max-width:700px){
  .app{grid-template-columns:1fr;grid-template-rows:50vh auto;height:auto}
  canvas{order:-1;border-bottom:1px solid var(--border)}
  .side{border-right:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="nav"><a href="../index.html">← Portfolio</a><span><b>2D</b> · <a href="../plot-3d/index.html">3D</a></span></div>
    <h1>Plot Lab</h1>
    <div id="rows"></div>
    <button class="go" id="add">+ Add function</button>
    <div id="sliders"></div>
    <button id="reset">Reset view</button>
    <p class="hint">Use the on-screen keypad (or ABC for your own keyboard). Any letter besides x becomes a slider. <code>diff(sin(x))</code> plots a symbolic derivative; tap the f′(x) line under a function to plot it.</p>
  </div>
  <canvas id="cv"></canvas>
</div>
<script src="../shared/mathpad.js"></script>
<script>
const COLORS=['#38bdf8','#f472b6','#34d399','#fbbf24','#a78bfa','#fb7185'];
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d'), rows=$('rows');
let fns=[{src:'sin(x)'},{src:'a*x²'}], params={}, symKey='';
const view={cx:0,cy:0,s:60};

function compile(f){
  f.err='';f.code=null;f.syms=[];f.d='';
  try{
    const s=MathPad.prep(f.src);if(!s.trim())return;
    const node=math.parse(s);
    f.code=node.compile();f.syms=MathPad.syms(node,['x']);
    try{f.d=math.derivative(node,'x').toString()}catch{}
  }catch(e){f.err=e.message}
}

function renderRows(){
  rows.innerHTML='';
  fns.forEach((f,i)=>{
    const w=document.createElement('div');
    w.innerHTML='<div class="fn"><span class="dot"></span><input type="text" placeholder="e.g. sin(x)" spellcheck="false" autocapitalize="none" autocomplete="off"><button title="Remove">×</button></div><div class="d"></div>';
    const [row,d]=w.children,inp=row.children[1];
    row.children[0].style.background=COLORS[i%COLORS.length];
    MathPad.field(inp);inp.value=f.src;
    const show=()=>{inp.classList.toggle('bad',!!f.err);d.textContent=f.d?'f′(x) = '+MathPad.pretty(f.d):''};
    show();
    inp.oninput=()=>{f.src=inp.value;compile(f);show();update()};
    d.onclick=()=>{if(f.d){const nf={src:f.d};compile(nf);fns.push(nf);renderRows();update()}};
    row.children[2].onclick=()=>{fns.splice(i,1);renderRows();update()};
    rows.append(w);
  });
}

function update(){
  const syms=[...new Set(fns.flatMap(f=>f.syms))].sort(), k=syms.join(',');
  if(k!==symKey){symKey=k;MathPad.sliders($('sliders'),syms,params,draw)}
  draw();
}

function draw(){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement),grid=css.getPropertyValue('--border').trim(),mut=css.getPropertyValue('--muted').trim();
  const X=x=>W/2+(x-view.cx)*view.s, Y=y=>H/2-(y-view.cy)*view.s;
  const raw=80/view.s,p=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(m=>m*p).find(v=>v>=raw);
  const x0=view.cx-W/2/view.s,x1=view.cx+W/2/view.s,y0=view.cy-H/2/view.s,y1=view.cy+H/2/view.s;
  const fmt=v=>String(parseFloat(v.toPrecision(10)));
  ctx.font='11px ui-monospace,monospace';ctx.lineWidth=1;
  const ax=Math.min(Math.max(Y(0),14),H-6), ay=Math.min(Math.max(X(0),4),W-30);
  for(let v=Math.ceil(x0/step)*step;v<=x1;v+=step){
    ctx.strokeStyle=Math.abs(v)<step/2?mut:grid;ctx.beginPath();ctx.moveTo(X(v),0);ctx.lineTo(X(v),H);ctx.stroke();
    if(Math.abs(v)>step/2){ctx.fillStyle=mut;ctx.fillText(fmt(v),X(v)+3,ax-3)}
  }
  for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step){
    ctx.strokeStyle=Math.abs(v)<step/2?mut:grid;ctx.beginPath();ctx.moveTo(0,Y(v));ctx.lineTo(W,Y(v));ctx.stroke();
    if(Math.abs(v)>step/2){ctx.fillStyle=mut;ctx.fillText(fmt(v),ay+4,Y(v)-3)}
  }
  fns.forEach((f,i)=>{
    if(!f.code)return;
    ctx.strokeStyle=COLORS[i%COLORS.length];ctx.lineWidth=2.2;ctx.beginPath();
    const sc={...params};let pen=false,py=0;
    for(let px=0;px<=W;px++){
      sc.x=view.cx+(px-W/2)/view.s;
      let y;try{y=f.code.evaluate(sc)}catch{y=NaN}
      if(typeof y!=='number'||!isFinite(y)){pen=false;continue}
      const sy=Y(y);
      if(pen&&Math.abs(sy-py)<H*2)ctx.lineTo(px,sy);else ctx.moveTo(px,sy);
      pen=true;py=sy;
    }
    ctx.stroke();
  });
}

function zoom(k,cx,cy){
  const r=cv.getBoundingClientRect(),dx=cx-r.left-r.width/2,dy=cy-r.top-r.height/2;
  const mx=view.cx+dx/view.s,my=view.cy-dy/view.s;
  view.s=Math.min(1e6,Math.max(1e-4,view.s*k));
  view.cx=mx-dx/view.s;view.cy=my+dy/view.s;
}
const ptrs=new Map();let lastD=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);lastD=0});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){view.cx-=(e.clientX-prev[0])/view.s;view.cy+=(e.clientY-prev[1])/view.s}
  else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastD)zoom(d/lastD,(a[0]+b[0])/2,(a[1]+b[1])/2);
    lastD=d;
  }
  draw();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{ptrs.delete(e.pointerId);lastD=0}));
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY);draw()},{passive:false});

$('add').onclick=()=>{fns.push({src:''});renderRows();rows.lastChild.querySelector('input').focus()};
$('reset').onclick=()=>{Object.assign(view,{cx:0,cy:0,s:60});draw()};
new ResizeObserver(draw).observe(cv);
matchMedia('(prefers-color-scheme:light)').addEventListener('change',draw);
fns.forEach(compile);renderRows();update();MathPad.attach();
</script>
</body>
</html>
